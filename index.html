<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🚗 Juego de Carros 3D</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="game-canvas"></div>

        <!-- Pantalla de inicio -->
        <div id="start-screen">
            <div class="start-content">
                <h1>🚗</h1>
                <h2>¡Vamos a Conducir!</h2>

                <!-- Selector de color -->
                <div id="color-picker">
                    <div class="color-option selected" data-color="0xFF4444" style="background:#FF4444"></div>
                    <div class="color-option" data-color="0x4488FF" style="background:#4488FF"></div>
                    <div class="color-option" data-color="0xFFCC00" style="background:#FFCC00"></div>
                    <div class="color-option" data-color="0x44CC44" style="background:#44CC44"></div>
                    <div class="color-option" data-color="0xFF66CC" style="background:#FF66CC"></div>
                    <div class="color-option" data-color="0xFF8800" style="background:#FF8800"></div>
                </div>

                <button id="start-button">▶ JUGAR</button>
            </div>
        </div>

        <!-- Controles táctiles -->
        <div id="controls">
            <div id="touch-left" class="touch-zone">
                <span class="zone-arrow">⬅️</span>
            </div>
            <div id="controls-center">
                <div id="touch-horn" class="horn-btn">
                    <span class="horn-icon">📯</span>
                </div>
                <div id="touch-brake" class="touch-zone-brake">
                    <span class="brake-icon">🛑</span>
                </div>
            </div>
            <div id="touch-right" class="touch-zone">
                <span class="zone-arrow">➡️</span>
            </div>
        </div>

        <!-- UI simplificada -->
        <div id="score-display">
            <span id="score-stars">⭐</span>
            <span id="score-number">0</span>
        </div>

        <!-- Indicador de tiempo del día -->
        <div id="time-display"></div>
    </div>

    <script src="game3d.js?v=2"></script>
</body>
</html>
